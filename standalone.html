/* 伪造条形码：确定性伪随机，黑条宽窄不一 */
function Barcode({ seed = 7 }) {
  let s = seed;
  const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
  const bars = Array.from({ length: 46 }, () => 1 + Math.floor(rnd() * 3));
  return (
    <div className="flex items-stretch justify-center" style={{ gap: "2px", height: "44px" }}>

/* ================= 极微音效（Web Audio 现场合成，零外部文件） ================= */

let audioCtx = null;

/* 浏览器自动播放策略：音频上下文必须在用户点击时唤醒 */
function ensureAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  if (!audioCtx) {
    try { audioCtx = new AC(); } catch (e) { return null; }
  }
  if (audioCtx.state === "suspended") Promise.resolve(audioCtx.resume()).catch(() => {});
  return audioCtx;
}

/* 老式打印机出纸的「沙沙」：带通噪声 + 频率抖动，贴合 1.9s 出票动画 */
function playPaperFeed() {
  const ctx = ensureAudio();
  if (!ctx || ctx.state !== "running") return;
  const dur = 1.8;
  const t = ctx.currentTime;
  const buffer = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const src = ctx.createBufferSource();
  src.buffer = buffer;
  const bp = ctx.createBiquadFilter();
  bp.type = "bandpass";
  bp.frequency.value = 2200;
  bp.Q.value = 0.7;
  const lfo = ctx.createOscillator();
  lfo.frequency.value = 11;
  const lfoGain = ctx.createGain();
  lfoGain.gain.value = 500;
  lfo.connect(lfoGain).connect(bp.frequency);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.03, t + 0.12);
  g.gain.setValueAtTime(0.03, t + dur - 0.45);
  g.gain.linearRampToValueAtTime(0, t + dur);
  src.connect(bp);
  bp.connect(g);
  g.connect(ctx.destination);
  src.start(t);
  src.stop(t + dur);
  lfo.start(t);
  lfo.stop(t + dur);
}

/* 收银铃「叮」：非谐分音，快攻击慢衰减，音量极弱 */
function playDing() {
  const ctx = ensureAudio();
  if (!ctx || ctx.state !== "running") return;
  const t = ctx.currentTime;
  [[1244, 0.045, 1.6], [3111, 0.02, 0.9], [4662, 0.01, 0.5]].forEach(([f, vol, dur]) => {
    const osc = ctx.createOscillator();
    osc.type = "sine";
    osc.frequency.value = f;
    const env = ctx.createGain();
    env.gain.setValueAtTime(0, t);
    env.gain.linearRampToValueAtTime(vol, t + 0.004);
    env.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(env).connect(ctx.destination);
    osc.start(t);
    osc.stop(t + dur + 0.05);
  });
}

        <span>OPENAINOTOPENPOCKET</span>
        <span className="text-neutral-800">|</span>
        <span>TOTAL $0.00</span>
      </div>
      {last && (
        <p className="anim-fade mt-6 font-mono text-[10px] tracking-[0.35em] text-neutral-500" style={{ animationDelay: "500ms" }}>
          PAID WITH YOUR CALM · 收款 $0.00
        </p>
      )}
    </div>
  );
}

/* ================= 赛博电子小票 ================= */

function Receipt({ items, count, orderNo, onReset }) {
  const d = new Date();
  const pad = (n) => String(n).padStart(2, "0");
  const dateStr = d.getFullYear() + "." + pad(d.getMonth() + 1) + "." + pad(d.getDate());
  const timeStr = pad(d.getHours()) + ":" + pad(d.getMinutes());
  const D = <div className="border-t border-dashed border-neutral-300 my-4" />;

  return (
    <div className="fixed inset-0 z-50 overflow-y-auto" style={{ background: "radial-gradient(circle at 50% 18%, #f6f6f4 0%, #e7e7e4 75%)" }}>
      <div className="min-h-full flex flex-col items-center justify-center py-14 px-4">
        <p className="anim-fade font-mono text-[10px] tracking-[0.5em] text-neutral-400 mb-8">YOUR RECEIPT · 请惠存</p>

        <div className="w-full flex flex-col items-center" style={{ filter: "drop-shadow(0 30px 45px rgba(0,0,0,0.16))" }}>
          {/* 打印机出票口 */}
          <div className="w-64 h-2.5 bg-neutral-800 rounded-full relative z-10" style={{ boxShadow: "0 3px 8px rgba(0,0,0,0.3)" }} />

          <div data-testid="receipt" className="anim-print w-[340px] max-w-full bg-white">
            <div className="zz-top" />
            <div className="px-7 pt-8 pb-7 font-mono text-neutral-900">
              <Barcode seed={17} />
              <p className="text-center text-[10px] tracking-[0.35em] text-neutral-500 mt-2">0 7240 1963 {orderNo}</p>

              <div className="mt-7 text-center">
                <p className="text-[15px] tracking-[0.2em] font-semibold">OpenAINotOpenPocket</p>
                <p className="text-[9px] tracking-[0.6em] text-neutral-500 mt-1.5">R E C E I P T</p>
              </div>

              {D}
              <div className="text-[10.5px] leading-[2.1] text-neutral-600">
                <div className="flex justify-between"><span>订单时间</span><span className="text-neutral-900">{dateStr} {timeStr}</span></div>
                <div className="flex justify-between"><span>订单编号</span><span className="text-neutral-900">No. {orderNo}</span></div>
                <div className="flex justify-between"><span>收银员</span><span className="text-neutral-900">今晚的月亮</span></div>
              </div>
              {D}

              <div className="text-[11px] leading-[2.4]">
                {items.map((it) => (
                  <div key={it.id} className="flex justify-between items-baseline gap-3">
                    <span className="text-neutral-900">
                      {it.name}<span className="text-neutral-400 ml-2">×{it.qty}</span>
                    </span>
                    <span className="shrink-0">$0.00</span>
                  </div>
                ))}
                <div className="flex justify-between text-neutral-500 mt-1">
                  <span>件数 QTY</span><span>{count}</span>
                </div>
              </div>
              {D}

              <div className="flex justify-between items-baseline">
                <span className="text-[13px] font-bold tracking-[0.2em]">合计 TOTAL</span>
                <span className="text-lg font-bold">$0.00</span>
              </div>
              <div className="text-[10.5px] leading-[2.1] text-neutral-600 mt-2">
                <div className="flex justify-between"><span>支付方式</span><span className="text-neutral-900">您的宁静 · PAID</span></div>
                <div className="flex justify-between"><span>找零</span><span className="text-neutral-900">$0.00</span></div>
              </div>
              {D}

              <div className="text-center font-serif italic text-[13px] leading-[2.2] text-neutral-700 px-1">
                世界很喧嚣，<br />
                但此刻你是宁静的。<br />
                <span className="text-neutral-500">您的钱包依然满载，一如您的灵魂。</span>
              </div>
              {D}

              <Barcode seed={42} />
              <p className="text-center text-[10px] tracking-[0.4em] text-neutral-500 mt-2">谢谢惠顾 · THANK YOU</p>
              <p className="text-center text-[9px] tracking-[0.2em] text-neutral-400 mt-2">情绪一经售出 · 概不退换</p>
            </div>
            <div className="zz-bottom" />
          </div>
        </div>

        <button
          data-testid="re-shop"
          onClick={onReset}
          className="anim-float mt-12 mb-6 px-12 py-3.5 border border-neutral-900 text-neutral-900 text-[11px] tracking-[0.4em] hover:bg-neutral-900 hover:text-white transition-all duration-500"
          style={{ animationDelay: "2.1s" }}
        >
          重新购物 · SHOP AGAIN
        </button>
      </div>
    </div>
  );
}

/* ================= 应用主体 ================= */

function App() {
  const [phase, setPhase] = useState("shop");   // shop | checkout | receipt
  const [cart, setCart] = useState([]);
  const [cartOpen, setCartOpen] = useState(false);
  const [step, setStep] = useState(0);
  const [added, setAdded] = useState(null);
  const [orderNo] = useState(() => String(Math.floor(10000 + Math.random() * 90000)));

  const count = cart.reduce((a, c) => a + c.qty, 0);
  const items = cart.map((c) => ({ ...PRODUCTS.find((p) => p.id === c.id), qty: c.qty }));

  useEffect(() => { window.scrollTo(0, 0); }, [phase]);

  useEffect(() => {
    const lock = cartOpen || phase === "checkout";
    document.body.style.overflow = lock ? "hidden" : "";
    return () => { document.body.style.overflow = ""; };
  }, [cartOpen, phase]);

  /* 结账流程：每 1.5s 切换一句话，最后一句停留后出票 */
  useEffect(() => {
    if (phase !== "checkout") return;
    ensureAudio();  /* 最后一次确保上下文唤醒，出票时才能发声 */
    const isLast = step === CHECKOUT_STEPS.length - 1;
    const t = setTimeout(
      () => (isLast ? setPhase("receipt") : setStep((s) => s + 1)),
      isLast ? 2200 : 1500
    );
    return () => clearTimeout(t);
  }, [phase, step]);

  const addToCart = (id) => {
    ensureAudio();  /* 用户点击时解锁音频上下文 */
    setCart((prev) => {
      const hit = prev.find((c) => c.id === id);
      return hit
        ? prev.map((c) => (c.id === id ? { ...c, qty: c.qty + 1 } : c))
        : [...prev, { id, qty: 1 }];
    });
    setAdded(id);
    setTimeout(() => setAdded((a) => (a === id ? null : a)), 1300);
  };

  const inc = (id) => setCart((prev) => prev.map((c) => (c.id === id ? { ...c, qty: c.qty + 1 } : c)));
  const dec = (id) => setCart((prev) => prev.map((c) => (c.id === id ? { ...c, qty: c.qty - 1 } : c)).filter((c) => c.qty > 0));

  const checkout = () => { ensureAudio(); setCartOpen(false); setStep(0); setPhase("checkout"); };

  useEffect(() => {
    if (phase !== "receipt") return;
    playDing();
    const t = setTimeout(playPaperFeed, 350);  /* 叮之后接出纸沙沙声 */
    return () => clearTimeout(t);
  }, [phase]);

  const reset = () => { setCart([]); setStep(0); setPhase("shop"); };

  return (
    <div className="min-h-screen bg-white text-neutral-900 font-sans">
      {phase === "shop" && (
        <React.Fragment>
          <Header count={count} onCart={() => setCartOpen(true)} />
          <main>
            <Hero />
            <ProductGrid onAdd={addToCart} added={added} />
          </main>
          <Footer />
        </React.Fragment>
      )}

      {phase === "checkout" && <CheckoutOverlay step={step} />}
      {phase === "receipt" && <Receipt items={items} count={count} orderNo={orderNo} onReset={reset} />}

      <CartSidebar
        open={cartOpen && phase === "shop"}
        items={items}
        count={count}
        onClose={() => setCartOpen(false)}
        onInc={inc}
        onDec={dec}
        onCheckout={checkout}
      />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
